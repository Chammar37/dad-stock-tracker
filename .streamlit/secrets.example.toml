[storage]
backend = "csv"

[connections.supabase]
url = "postgresql+psycopg2://postgres.PROJECT_REF:DB_PASSWORD@aws-0-REGION.pooler.supabase.com:6543/postgres"

[auth]
app_password = "replace-with-a-strong-password"

# Local development may instead use these names in .env:
# STOCK_TRACKER_STORAGE_BACKEND="supabase"
# SUPABASE_DATABASE_URL="postgresql+psycopg2://..."
# STOCK_TRACKER_APP_PASSWORD="replace-with-a-strong-password"
